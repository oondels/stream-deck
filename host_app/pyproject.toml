[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "streamdeck-monitor"
version = "0.1.0"
description = "Monitor serial do Stream Deck Mini"
requires-python = ">=3.11"
dependencies = ["pyserial==3.5"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
build = ["PyInstaller>=6.10,<7", "Pillow>=11,<13"]
gui-test = ["pytest-qt>=4.4,<5"]

[project.scripts]
streamdeck-monitor = "streamdeck_monitor.bootstrap:main"
streamdeck-gui = "streamdeck_monitor.gui.bootstrap:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["streamdeck_monitor*"]

[tool.setuptools.package-data]
"streamdeck_monitor.gui" = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
