[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = platformio/espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_src_filter =
    +<*>

[env:native]
platform = native
build_flags =
    -std=gnu++17
build_src_filter =
    +<domain/*>
    +<application/*>
test_build_src = true
